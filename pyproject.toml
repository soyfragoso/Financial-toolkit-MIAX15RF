
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-toolkit"
version = "0.1.0"
description = "Financial data analysis and Monte Carlo portfolio simulation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "Source"}

[tool.setuptools.packages.find]
where = ["Source"]

