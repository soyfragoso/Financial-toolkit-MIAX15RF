
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-toolkit"
version = "1.2.2"
description = "MIAX 15 Financial Powertool: Sharpe and Sortino analytics, data quality and integrity controls, and Monte Carlo portfolio simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

cli = [
    "rich>=13.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

